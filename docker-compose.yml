name: siem-lite

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: siem
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-siem}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  siem-lite:
    build:
      context: .
      target: siem-lite
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      SIEM_CLICKHOUSE_DSN: clickhouse://${CLICKHOUSE_USER:-siem}:${CLICKHOUSE_PASSWORD}@clickhouse:9000/siem
      SIEM_GEO_CSV: /app/geo/demo-geo.csv
      SIEM_SNAPSHOT_PATH: /data/detector-state.json
      SIEM_INGEST_TOKEN: ${SIEM_INGEST_TOKEN:-}
      SIEM_WEBHOOK_URL: ${SIEM_WEBHOOK_URL:-}
      SIEM_WEBHOOK_SECRET: ${SIEM_WEBHOOK_SECRET:-}
      SIEM_SLACK_WEBHOOK_URL: ${SIEM_SLACK_WEBHOOK_URL:-}
      SIEM_LOG_LEVEL: ${SIEM_LOG_LEVEL:-info}
    ports:
      - "8080:8080"
      - "5514:5514/udp"
      - "5514:5514/tcp"
    volumes:
      - siem-state:/data

  loggen:
    build:
      context: .
      target: loggen
    depends_on:
      - siem-lite
    environment:
      LOGGEN_SYSLOG_ADDR: siem-lite:5514
      LOGGEN_INGEST_URL: http://siem-lite:8080/v1/ingest
      LOGGEN_TOKEN: ${SIEM_INGEST_TOKEN:-}
    command: ["-proto", "tcp", "-rate", "25", "-attack-interval", "20s"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    depends_on:
      - clickhouse
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource 4.4.0
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-siem}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  clickhouse-data:
  siem-state:
