version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [errcheck, gocritic]
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mahyarnemati/siem-lite
